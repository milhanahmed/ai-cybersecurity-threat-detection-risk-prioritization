<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cybersecurity Risk Prioritization Dashboard</title>
  <style>
    body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#1f2937}.wrap{max-width:1100px;margin:30px auto;padding:0 18px}.card{background:white;border-radius:10px;padding:20px;margin-bottom:20px;box-shadow:0 2px 10px rgba(0,0,0,.08)}h1{margin-top:0}form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}input,select,button{padding:10px;border:1px solid #cbd5e1;border-radius:6px}button{background:#111827;color:white;cursor:pointer}.full{grid-column:1/-1}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left}.high{font-weight:bold}.medium{font-weight:bold}.low{font-weight:bold}#result{white-space:pre-wrap;background:#f8fafc;padding:12px;border-radius:6px}@media(max-width:700px){form{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>AI-Assisted Cybersecurity Risk Dashboard</h1>
    <p>Submit a security event for validation, AI classification, risk scoring, persistence, and analyst review.</p>
  </div>
  <div class="card">
    <h2>Analyze Event</h2>
    <form id="eventForm">
      <input maxlength="128" aria-label="Event ID" id="event_id" placeholder="Event ID" value="E-1001" required />
      <input aria-label="Timestamp in ISO 8601 format" id="timestamp" placeholder="Timestamp" value="2026-10-26T12:00:00Z" required />
      <input maxlength="128" aria-label="Event source" id="source" placeholder="Source" value="vpn-gateway" required />
      <select aria-label="Event type" id="event_type"><option>login_failure</option><option>malware_alert</option><option>privilege_change</option><option>login_success</option><option>file_read</option></select>
      <input aria-label="Failed attempts" id="failed_attempts" type="number" min="0" value="8" />
      <select aria-label="Known bad IP indicator" id="known_bad_ip"><option value="1">Known bad IP: Yes</option><option value="0">Known bad IP: No</option></select>
      <select aria-label="Privileged account indicator" id="privileged_account"><option value="1">Privileged account: Yes</option><option value="0">Privileged account: No</option></select>
      <input aria-label="Severity from zero to one" id="severity" type="number" min="0" max="1" step="0.1" value="0.9" />
      <input aria-label="Business impact from zero to one" id="business_impact" type="number" min="0" max="1" step="0.1" value="0.8" />
      <button class="full" type="submit">Analyze Security Event</button>
    </form>
    <h3>Latest Output</h3><div id="result" role="status" aria-live="polite">No event analyzed yet.</div>
  </div>
  <div class="card">
    <h2>Recent Analyzed Events</h2>
    <table><thead><tr><th>Event</th><th>Type</th><th>Prediction</th><th>Confidence</th><th>Risk</th><th>Priority</th></tr></thead><tbody id="eventsBody"></tbody></table>
  </div>
</div>
<script>
async function readResponse(response) {
  const data = await response.json();
  if (!response.ok) {
    const message = typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail);
    throw new Error(message || `Request failed (${response.status})`);
  }
  return data;
}
async function loadEvents() {
  const response = await fetch('/events');
  const data = await readResponse(response);
  const body = document.getElementById('eventsBody');
  body.replaceChildren();
  data.events.forEach(event => {
    const row = document.createElement('tr');
    [event.event_id, event.event_type, event.predicted_label, event.confidence,
     event.risk_score, event.priority.toUpperCase()].forEach(value => {
      const cell = document.createElement('td');
      cell.textContent = String(value);
      row.appendChild(cell);
    });
    body.appendChild(row);
  });
}
document.getElementById('eventForm').addEventListener('submit', async ev => {
  ev.preventDefault();
  const form = ev.currentTarget;
  const result = document.getElementById('result');
  const button = form.querySelector('button');
  const value = id => document.getElementById(id).value.trim();
  if (!form.reportValidity()) return;
  if (!value('event_id') || !value('source')) {
    result.textContent = 'Event ID and source must contain non-space characters.';
    return;
  }
  const payload = {event_id:value('event_id'), timestamp:value('timestamp'),
    source:value('source'), event_type:value('event_type'),
    failed_attempts:Number(value('failed_attempts')), known_bad_ip:Number(value('known_bad_ip')),
    privileged_account:Number(value('privileged_account')), severity:Number(value('severity')),
    business_impact:Number(value('business_impact'))};
  button.disabled = true;
  try {
    const response = await fetch('/analyze', {method:'POST',
      headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
    const data = await readResponse(response);
    result.textContent = JSON.stringify(data, null, 2);
    await loadEvents();
  } catch (error) {
    result.textContent = 'Request could not be completed: ' + error.message;
  } finally { button.disabled = false; }
});
loadEvents().catch(error => {document.getElementById('result').textContent = error.message;});
</script>
</body>
</html>
